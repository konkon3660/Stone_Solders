<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181b">
<title>문명 대전 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.mods { display: grid; gap: 8px; margin-top: 12px; }
.mod { text-align: left; }
.mod b { display: block; }
.mod small { color: var(--muted); font-size: .84rem; }
.mod[aria-pressed="true"] { border: 2px solid var(--gold); background: #3a372c; padding: 8px 13px; }
.panel .tab { flex: none; width: 56px; }
.on-mods { font-size: .82rem; color: var(--gold); margin-top: 4px; }
.queue { display: inline-flex; gap: 4px; }
.lane { font-family: var(--display); margin-top: 14px; }
.picks.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pick.offer { display: block; text-align: left; height: auto; padding: 8px 10px; }
.pick.offer[aria-pressed="true"] { padding: 7px 9px; }
.pick.offer .labels > * { display: block; white-space: normal; margin-top: 3px; }
.hand-row > .hand-body:first-child { grid-column: 1 / -1; }
.tree-wrap { overflow-x: auto; margin-top: 8px; }
.tree-svg { display: block; width: 100%; min-width: 400px; height: auto; }
.tree-svg text { text-anchor: middle; font-size: 11px; fill: var(--ink); }
.tree-svg .tn { font-weight: 600; }
.tree-svg .tp { fill: var(--gold); font-size: 10.5px; }
.tree-svg .tf { fill: var(--special); font-size: 9.5px; }
.tree-svg .node rect { fill: var(--panel-2); stroke: var(--line); }
.tree-svg .node.here rect { fill: #3a372c; stroke: var(--gold); stroke-width: 2.5; }
.tree-svg .node.next rect { stroke: var(--gold); stroke-dasharray: 4 3; }
.tree-svg .node rect.badge { fill: var(--gold); stroke: none; }
.tree-svg .tb { fill: var(--bg); font-size: 10px; font-weight: 700; }
.tree-svg .edge line { stroke-width: 2; }
.tree-svg .eb line { stroke: #6c757b; }
.tree-svg .ew line { stroke: #cfccc4; }
.tree-svg .edge circle { stroke: #8a9298; stroke-width: 1; }
.tree-svg .eb circle { fill: #0b0d0e; }
.tree-svg .ew circle { fill: #f2f0ea; }
.tree-svg.marked .edge { opacity: .35; }
.tree-svg.marked .edge.hot { opacity: 1; }
.tree-svg.marked .edge.hot line { stroke-width: 3.5; }
.tree-svg .root { fill: var(--panel-2); stroke: var(--line); }
.tree-svg .root-t { font-size: 9px; fill: var(--muted); }
@media (min-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr) 470px; } }
.perms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 8px; margin-top: 4px; }
@media (min-width: 720px) { .mods { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="table-sheet" aria-label="족보표"></dialog>
<script src="game.js"></script>
<script src="art.js"></script>
<script src="lab-rules.js"></script>
<script src="lab-ui.js"></script>
</body>
</html>
