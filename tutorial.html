<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181b">
<title>문명 대전 튜토리얼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.tut-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .9rem; color: var(--muted); }
.tut-top a { color: var(--gold); padding: 10px 0; }
.coach { border-color: var(--gold); margin-top: 6px; }
.coach p { margin-top: 8px; }
.tut-pick { grid-template-columns: minmax(0, 1fr); }
.tut-pick .pick { flex-direction: row; justify-content: center; gap: 8px; }
.tut-bar { display: flex; gap: 8px; margin-top: 14px; }
.tut-bar > * { flex: 1; }
.tut-bar a { display: grid; place-items: center; padding: 10px 15px; border-radius: 8px; text-decoration: none; }
.tut-card { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 10px; align-items: center; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="game.js"></script>
<script src="art.js"></script>
<script src="tutorial.js"></script>
</body>
</html>
