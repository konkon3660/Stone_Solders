<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문명 대전 프로토타입</title>
<style>
  :root { --bg:#f5f2ea; --card:#fffdf8; --ink:#23211c; --muted:#6b665b; --line:#d9d3c5; --accent:#2f5d62; --accent-soft:#e1ecec; --gray:#8f8a7e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,"Malgun Gothic",sans-serif; }
  .wrap { max-width:1240px; margin:auto; padding:16px; }
  h1 { font-size:1.3rem; margin:0; }
  h2 { font-size:1.05rem; margin:20px 0 8px; }
  p { margin:6px 0; }
  .muted { color:var(--muted); font-size:.9rem; }
  .top { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:4px 16px; border-bottom:1px solid var(--line); padding-bottom:10px; }
  .score { font-size:1.15rem; font-weight:700; }
  .layout { display:grid; gap:20px; }
  @media (min-width:1000px) { .layout { grid-template-columns:minmax(0,1fr) 360px; } }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .card.selected { border:2px solid var(--accent); padding:11px; }
  .card.banned { background:#efebe1; }
  .card-head { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .tag { font-size:.8rem; color:var(--muted); }
  .tag.off { color:#9a3b26; font-weight:600; }
  .stones { display:flex; flex-wrap:wrap; gap:8px; min-height:38px; align-items:center; padding:4px 3px; }
  .stone { display:inline-grid; place-items:center; width:30px; height:30px; border-radius:50%; font-size:.8rem; font-weight:700; flex:none; }
  .stone.b { background:#1d1d1d; color:#fff; }
  .stone.w { background:#fff; color:#1d1d1d; border:1.5px solid #8a8578; }
  .stone.hidden { background:var(--gray); color:#fff; }
  .stone.from-gray { box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--gray); }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:6px; padding:6px 10px; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button:disabled { cursor:not-allowed; color:var(--muted); background:#eee9dd; }
  .primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; padding:10px 18px; }
  .primary:disabled { background:#b9c4c2; border-color:#b9c4c2; color:#fff; }
  .picks { display:grid; gap:6px; margin:8px 0 0; }
  .pick { display:flex; align-items:center; gap:8px; text-align:left; font-size:.88rem; padding:5px 8px; }
  .pick[aria-pressed=true] { border:2px solid var(--accent); background:var(--accent-soft); padding:4px 7px; }
  .fight { width:100%; margin-top:8px; }
  .fight[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:16px 0; }
  table { width:100%; border-collapse:collapse; background:var(--card); font-size:.85rem; margin-bottom:6px; }
  caption { text-align:left; font-weight:700; padding:6px 0; }
  td { border-top:1px solid var(--line); padding:4px 6px; vertical-align:top; }
  td:first-child { white-space:nowrap; color:var(--muted); }
  td small { color:var(--muted); display:block; line-height:1.3; }
  tr.special { background:var(--accent-soft); }
  details { margin:12px 0; }
  summary { cursor:pointer; font-weight:600; }
  .duel { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; }
  .winner { border:2px solid var(--accent); padding:11px; }
  .result-line { font-size:1.15rem; font-weight:700; margin:12px 0 2px; }
  ol.history { padding-left:0; list-style:none; margin:0; font-size:.88rem; }
  ol.history li { padding:4px 0; border-top:1px solid var(--line); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px; margin:16px 0; }
  .question { background:var(--accent-soft); border-radius:6px; padding:10px 12px; }
  .notice { background:#f6e3dc; color:#7a2e1a; border-radius:6px; padding:10px 12px; margin:12px 0; }
  .code { font-size:2rem; font-weight:700; letter-spacing:.2em; }
  input { font:inherit; border:1px solid var(--line); border-radius:6px; padding:8px 10px; width:7em; background:#fff; color:var(--ink); text-transform:uppercase; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR" crossorigin="anonymous"></script>
<script src="game.js"></script>

<script>
// 화면 셸. 버릴 코드.
const app = document.getElementById('app');
const LETTERS = 'ABC';
const COLOR_NAME = { B:'흑', W:'백' };
let s, mode, phase = 'start', viewer = 0, assigns, fighters, ui, net = null, notice = '';

const nameOf = p => mode === 'bot' ? ['나','봇'][p] : mode === 'online' ? (p === viewer ? '나' : '상대') : `플레이어 ${p + 1}`;
const squadTitle = p => mode !== 'hotseat' && p === viewer ? '내 문명' : `${nameOf(p)} 문명`;
const comboText = (b, w) => b && w ? `흑 ${b} / 백 ${w}` : b ? `흑 ${b}` : `백 ${w}`;
const star = e => e.special ? ' ★' : '';
const handText = e => `${e.rank}위 ${e.name}${star(e)} (${comboText(e.black, e.white)})`;
const eul = word => (word.charCodeAt(word.length - 1) - 0xAC00) % 28 ? '을' : '를';
const beatText = (t, count) => { const names = TABLES[t].slice(0, count).map(row => row[2]); return `${names.join(', ')}${eul(names.at(-1))} 이긴다`; };
const mine = v => v === viewer;

function stoneHTML(st, owner, view) {
  if (st.kind === 'G' && !st.revealed && view !== 'all' && view !== owner) return '<span class="stone hidden" title="공개되지 않은 회색돌">?</span>';
  return `<span class="stone ${st.color === 'B' ? 'b' : 'w'} ${st.kind === 'G' ? 'from-gray' : ''}" title="${st.kind === 'G' ? '회색돌에서 나온 ' : ''}${COLOR_NAME[st.color]}돌">${COLOR_NAME[st.color]}</span>`;
}

function banTag(civ) {
  const left = civ.bannedThrough - s.turn + 1;
  return left > 0 ? `<span class="tag off">출전 제한 ${left}턴</span>` : '<span class="tag">출전 가능</span>';
}

function civCard(owner, i, view) {
  const civ = s.players[owner].civs[i];
  const visible = civ.stones.filter(st => !(st.kind === 'G' && !st.revealed && view !== 'all' && view !== owner));
  const black = visible.filter(st => st.color === 'B').length;
  const hidden = civ.stones.length - visible.length;
  let info = civ.stones.length ? `흑 ${black} · 백 ${visible.length - black}${hidden ? ` · 미공개 ${hidden}` : ''}` : '돌 없음';
  if ((phase === 'assign' || phase === 'fight') && !s.over) {
    if (civ.bannedThrough < s.turn) {
      const known = view === owner ? colorsOf(civ) : publicSeq(civ), h = possibleHands(s.turn, known);
      info += h.best === h.worst ? `<br>이번 턴 족보: ${h.best}위 ${h.name}` : `<br>이번 턴 가능 순위: ${h.best}~${h.worst}위`;
      if (h.specials.length && h.best !== h.worst) info += `<br>★ ${h.specials.join(', ')} 가능`;
    } else info += '<br>이번 턴 출전 불가';
  }
  return `<article class="card ${civ.bannedThrough >= s.turn && !s.over ? 'banned' : ''}">
    <div class="card-head"><strong>문명 ${LETTERS[i]}</strong>${s.over ? '' : banTag(civ)}</div>
    <div class="stones">${civ.stones.map(st => stoneHTML(st, owner, view)).join('')}</div>
    <p class="muted">${info}</p>
  </article>`;
}

function assignCard(i) {
  const v = viewer, civ = s.players[v].civs[i], seq = colorsOf(civ);
  const picks = ['B','W','G'].map(kind => {
    const color = stoneColor(s, v, kind), e = evaluate(s.turn, seq + color), on = ui.assign[i] === kind;
    const stone = `<span class="stone ${color === 'B' ? 'b' : 'w'} ${kind === 'G' ? 'from-gray' : ''}">${COLOR_NAME[color]}</span>`;
    return `<button class="pick" data-act="assign" data-i="${i}" data-kind="${kind}" aria-pressed="${on}">${stone}
      <span>${kind === 'G' ? `회색(실제 ${COLOR_NAME[color]})` : `${COLOR_NAME[color]}돌`} 받으면 <b>${e.rank}위</b> ${e.name}${star(e)}</span></button>`;
  }).join('');
  return `<article class="card ${civ.bannedThrough >= s.turn ? 'banned' : ''}">
    <div class="card-head"><strong>문명 ${LETTERS[i]}</strong>${banTag(civ)}</div>
    <div class="stones">${civ.stones.map(st => stoneHTML(st, v, v)).join('') || '<span class="muted">돌 없음</span>'}</div>
    <div class="picks">${picks}</div>
  </article>`;
}

function fightCard(i) {
  const v = viewer, civ = s.players[v].civs[i], e = evaluate(s.turn, colorsOf(civ));
  const legal = civ.bannedThrough < s.turn, onlyOne = legalFighters(s, v).length === 1;
  const label = !legal ? `출전 제한 (${civ.bannedThrough - s.turn + 1}턴)` : onlyOne ? '강제 출전' : ui.fighter === i ? '출전 선택됨' : '이 문명 출전';
  return `<article class="card ${ui.fighter === i ? 'selected' : legal ? '' : 'banned'}">
    <div class="card-head"><strong>문명 ${LETTERS[i]}</strong>${banTag(civ)}</div>
    <div class="stones">${civ.stones.map(st => stoneHTML(st, v, v)).join('')}</div>
    <p>${handText(e)}</p>
    <p class="muted">${e.why}${e.special ? `. ${beatText(s.turn, e.beats)}` : ''}</p>
    <button class="fight" data-act="fight" data-i="${i}" aria-pressed="${ui.fighter === i}" ${legal && !onlyOne ? '' : 'disabled'}>${label}</button>
  </article>`;
}

function rankTable(t, note = '') {
  return `<table><caption>${t}턴 · ${ERAS[t][0]}${note}</caption><tbody>
    ${TABLES[t].map((row, i) => `<tr class="${row[4] ? 'special' : ''}"><td>${i + 1}위</td><td>${row[4] ? `★ ${row[5]}` : comboText(row[0], row[1])}</td><td><b>${row[2]}</b><small>${row[3]}${row[4] ? `. ${beatText(t, row[6] ?? 1)}` : ''}</small></td></tr>`).join('')}
    </tbody></table>`;
}

function tablesHTML(t) {
  const rest = Object.keys(TABLES).map(Number).filter(u => u !== t && u !== t + 1);
  return `<aside>
    ${rankTable(t, ' (이번 턴)')}
    ${t < LAST_TURN ? rankTable(t + 1, ' (다음 턴)') : ''}
    <details><summary>나머지 턴 족보</summary>${rest.map(u => rankTable(u)).join('')}</details>
  </aside>`;
}

function historyHTML() {
  if (!s.history.length) return '';
  const lines = s.history.map(h => {
    const result = h.winner === null ? '무승부' : `${nameOf(h.winner)} 승 +${pointsFor(h.turn)}`;
    return `<li>${h.turn}턴: ${nameOf(0)} ${LETTERS[h.fighters[0]]} ${h.hands[0].rank}위 ${h.hands[0].name}${star(h.hands[0])} vs ${nameOf(1)} ${LETTERS[h.fighters[1]]} ${h.hands[1].rank}위 ${h.hands[1].name}${star(h.hands[1])} · <b>${result}</b> · 출전 선택지 ${h.choices[0]}개/${h.choices[1]}개</li>`;
  }).join('');
  return `<h2>전투 기록</h2><ol class="history">${lines}</ol>`;
}

function header(t) {
  return `<header class="top">
    <div><h1>${t}/${LAST_TURN}턴 · ${ERAS[t][0]}</h1><p class="muted">${ERAS[t][1]} 승리 시 ${pointsFor(t)}점.</p></div>
    <div class="score">${nameOf(0)} ${s.players[0].score}점 : ${s.players[1].score}점 ${nameOf(1)}</div>
  </header>`;
}

const screens = {
  start: () => `<div class="panel">
    <h1>문명 대전 프로토타입</h1>
    <p class="question"><b>이 프로토타입이 답할 질문:</b> 돌 배치를 공개한 뒤 출전을 정하는 현재 규칙이 플레이해서 재미있는가?</p>
    <ul>
      <li>7턴 동안 매 턴 흑돌, 백돌, 회색돌을 문명 3개에 하나씩 나눠 줍니다.</li>
      <li>양쪽이 돌 배치를 비공개로 정하면 동시에 공개합니다. 회색돌의 실제 색은 숨겨집니다.</li>
      <li>공개된 배치를 보고 양쪽이 출전할 문명을 비공개로 동시에 정합니다. 출전한 문명의 회색돌은 그때 공개됩니다.</li>
      <li>문명은 누적한 돌의 색 개수로 그 턴의 족보 순위를 겨룹니다. 순위가 같으면 무승부입니다.</li>
      <li>★ 특수 족보는 돌을 받은 순서가 정해진 모양에 맞아야 완성되며, 그 턴 1위 족보를 이깁니다(7턴은 상위 3개). 나머지 상대에게는 표의 순위대로 판정합니다.</li>
      <li>승리 문명은 다음 2턴, 패배·무승부 문명은 다음 1턴 동안 출전할 수 없습니다.</li>
      <li>승리 점수는 1~4턴 1점, 5·6턴 2점, 7턴 5점. 7턴 후 승점이 많은 쪽이 이깁니다.</li>
    </ul>
    <p class="bar">
      <button class="primary" data-act="start" data-mode="bot">봇과 대전</button>
      <button class="primary" data-act="start" data-mode="hotseat">둘이서 번갈아 하기</button>
    </p>
    <h2>멀리 있는 사람과 하기</h2>
    <p class="bar">
      <button class="primary" data-act="host">온라인 방 만들기</button>
      <label for="join-code">방 코드</label>
      <input id="join-code" maxlength="4" autocomplete="off">
      <button data-act="join">참가</button>
    </p>
    <p class="muted">회색 테두리 돌은 회색돌에서 나온 돌입니다. 기록은 저장되지 않습니다.</p>
  </div>`,

  lobby: () => net.role === 'host'
    ? `<div class="panel">
        <h1>온라인 방</h1>
        <p class="code">${net.code}</p>
        <p>상대에게 이 코드를 알려 주세요. 상대가 참가하면 게임이 시작됩니다. 이 창을 닫으면 방이 사라집니다.</p>
        <p class="bar"><button data-act="home">취소</button></p>
      </div>`
    : `<div class="panel">
        <h1>방 ${net.code}에 연결하는 중</h1>
        <p class="muted">최대 20초 걸릴 수 있습니다.</p>
        <p class="bar"><button data-act="home">취소</button></p>
      </div>`,

  waiting: () => `${header(s.turn)}<div class="panel">
    <p class="result-line">상대를 기다리는 중</p>
    <p class="muted">${s.stage === 'assign' ? '돌 배치를 확정했습니다. 상대가 확정하면 양쪽 배치가 공개됩니다.' : '출전 문명을 확정했습니다. 상대가 확정하면 전투합니다.'}</p>
    ${historyHTML()}
  </div>`,

  pass: () => `<div class="panel">
    <h1>${nameOf(viewer)} 차례</h1>
    <p>${s.turn}/${LAST_TURN}턴 ${s.stage === 'assign' ? '돌 배치' : '문명 출전'}. 기기를 ${nameOf(viewer)}에게 넘겨주세요. 상대는 화면을 보지 마세요.</p>
    <p class="bar"><button class="primary" data-act="ready">준비 완료</button></p>
  </div>`,

  assign: () => {
    const v = viewer, t = s.turn;
    return `${header(t)}<div class="layout"><main>
      <h2>1단계: 돌 배치</h2>
      <p class="muted">이번 턴 회색돌의 실제 색: ${COLOR_NAME[s.gray[v]]}. 돌을 고르면 겹치는 문명과 자동으로 맞바꿉니다.</p>
      <h2>${nameOf(1 - v)} 문명</h2>
      <div class="cards">${[0,1,2].map(i => civCard(1 - v, i, v)).join('')}</div>
      <h2>${squadTitle(v)}</h2>
      <div class="cards">${[0,1,2].map(assignCard).join('')}</div>
      <p class="bar"><button class="primary" data-act="confirmAssign" ${ui.assign.includes(null) ? 'disabled' : ''}>돌 배치 확정</button><span class="muted">${ui.assign.includes(null) ? '돌을 모두 나눠 주세요.' : ''}</span></p>
      ${historyHTML()}
    </main>${tablesHTML(t)}</div>`;
  },

  fight: () => {
    const v = viewer, t = s.turn;
    return `${header(t)}<div class="layout"><main>
      <h2>2단계: 문명 출전</h2>
      <p class="muted">양쪽 돌 배치가 공개되었습니다. 상대의 배치를 보고 출전할 문명을 고르세요.</p>
      <h2>${nameOf(1 - v)} 문명</h2>
      <div class="cards">${[0,1,2].map(i => civCard(1 - v, i, v)).join('')}</div>
      <h2>${squadTitle(v)}</h2>
      <div class="cards">${[0,1,2].map(fightCard).join('')}</div>
      <p class="bar"><button class="primary" data-act="confirmFight" ${ui.fighter === null ? 'disabled' : ''}>출전 확정</button><span class="muted">${ui.fighter === null ? '출전할 문명을 고르세요.' : ''}</span></p>
      ${historyHTML()}
    </main>${tablesHTML(t)}</div>`;
  },

  result: () => {
    const h = s.history.at(-1), view = mode === 'hotseat' ? null : viewer, [a, b] = h.hands;
    const reason = h.winner !== null && h.hands[1 - h.winner].rank <= h.hands[h.winner].beats ? `★ ${h.hands[h.winner].name}: ${h.hands[1 - h.winner].name}${eul(h.hands[1 - h.winner].name)} 이김`
      : a.rank !== b.rank ? `${a.rank}위 대 ${b.rank}위` : '같은 족보';
    const bans = h.winner === null ? '양쪽 문명 다음 1턴 출전 제한.' : '승리 문명 다음 2턴, 패배 문명 다음 1턴 출전 제한.';
    const duel = p => `<article class="card ${h.winner === p ? 'winner' : ''}">
      <div class="card-head"><strong>${nameOf(p)} · 문명 ${LETTERS[h.fighters[p]]}</strong><span class="tag">${h.winner === p ? '승리' : h.winner === null ? '무승부' : '패배'}</span></div>
      <div class="stones">${s.players[p].civs[h.fighters[p]].stones.map(st => stoneHTML(st, p, view)).join('')}</div>
      <p>${handText(h.hands[p])}</p>
      <p class="muted">${h.hands[p].why}</p>
    </article>`;
    return `${header(h.turn)}<div class="layout"><main>
      <p class="result-line">${h.winner === null ? '무승부' : `${nameOf(h.winner)} 승리 +${pointsFor(h.turn)}점`}</p>
      <p class="muted">${reason}. ${bans}</p>
      <div class="duel">${duel(0)}${duel(1)}</div>
      <p class="bar"><button class="primary" data-act="next">${s.over ? '최종 결과 보기' : '다음 턴'}</button></p>
      <h2>${squadTitle(0)}</h2><div class="cards">${[0,1,2].map(i => civCard(0, i, view)).join('')}</div>
      <h2>${nameOf(1)} 문명</h2><div class="cards">${[0,1,2].map(i => civCard(1, i, view)).join('')}</div>
      ${historyHTML()}
    </main>${tablesHTML(h.turn)}</div>`;
  },

  end: () => {
    const [a, b] = s.players.map(p => p.score);
    return `<div class="panel">
      <h1>${a === b ? '무승부' : `${nameOf(a > b ? 0 : 1)} 승리`}</h1>
      <p class="score">${nameOf(0)} ${a}점 : ${b}점 ${nameOf(1)}</p>
      <p class="bar">${mode !== 'online' ? `<button class="primary" data-act="start" data-mode="${mode}">다시 하기</button>`
        : net?.role === 'host' ? '<button class="primary" data-act="rematch">다시 하기</button>'
        : '<span class="muted">방을 만든 쪽이 새 게임을 시작할 수 있습니다.</span>'}<button data-act="home">처음으로</button></p>
      <h2>${squadTitle(0)} (전체 공개)</h2><div class="cards">${[0,1,2].map(i => civCard(0, i, 'all')).join('')}</div>
      <h2>${nameOf(1)} 문명 (전체 공개)</h2><div class="cards">${[0,1,2].map(i => civCard(1, i, 'all')).join('')}</div>
      ${historyHTML()}
    </div>`;
  },
};

function enterStage() {
  if (s.over) { phase = 'end'; return; }
  const legal = legalFighters(s, viewer);
  ui = { assign:[null, null, null], fighter: legal.length === 1 ? legal[0] : null };
  phase = s.stage;
}

function beginTurn() {
  assigns = [null, null];
  fighters = [null, null];
  viewer = 0;
  if (mode === 'bot') {
    assigns[1] = botAssign(s, 1);
    enterStage();
  } else phase = 'pass';
}

// 온라인: 방을 만든 쪽이 규칙을 계산하고, 참가자에게는 비밀을 지운 상태만 보낸다.
// ponytail: 방을 만든 쪽이 창을 닫거나 새로고침하면 게임이 끝남. 이어 하기가 필요하면 저장 추가. 그쪽은 개발자 도구로 비밀을 볼 수 있음.
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const roomId = code => `stone-soldiers-proto-${code}`;
const NET_ERRORS = {
  'peer-unavailable': '그 코드의 방을 찾을 수 없습니다. 코드를 확인하고, 방을 만든 창이 열려 있는지 확인하세요.',
  'unavailable-id': '방 코드가 겹쳤습니다. 다시 만들어 주세요.',
  'timeout': '연결하지 못했습니다. 일부 회사나 학교 네트워크에서는 막힐 수 있습니다.',
};

function leaveRoom() {
  net?.peer?.destroy();
  net = null;
}

function failNet(err) {
  if (!net || net.conn?.open) return;
  notice = NET_ERRORS[err?.type] ?? '연결하지 못했습니다. 잠시 뒤 다시 시도하세요.';
  leaveRoom();
  phase = 'start';
  render();
}

function sendState() {
  if (net?.conn?.open) net.conn.send({ type:'state', s:maskFor(s, 0) });
}

function hostAdvance() {
  if (s.stage === 'assign' && assigns[0] && assigns[1]) {
    s = placeStones(s, assigns);
    sendState();
    if (phase === 'waiting') enterStage();
  } else if (s.stage === 'fight' && fighters[0] !== null && fighters[1] !== null) {
    s = fightTurn(s, fighters);
    assigns = [null, null];
    fighters = [null, null];
    sendState();
    phase = 'result';
  }
}

function onGuestMove(msg) {
  const validAssign = Array.isArray(msg?.assign) && msg.assign.length === 3 && ['B','W','G'].every(k => msg.assign.includes(k));
  if (msg?.type === 'assign' && !s.over && s.stage === 'assign' && validAssign) assigns[1] = msg.assign;
  else if (msg?.type === 'fight' && !s.over && s.stage === 'fight' && legalFighters(s, 1).includes(msg.fighter)) fighters[1] = msg.fighter;
  else return;
  hostAdvance();
  render();
}

function openRoom() {
  const code = Array.from(crypto.getRandomValues(new Uint8Array(4)), b => CODE_CHARS[b % CODE_CHARS.length]).join('');
  mode = 'online';
  viewer = 0;
  s = newGame();
  assigns = [null, null];
  fighters = [null, null];
  net = { role:'host', code, conn:null, lost:false, peer:new Peer(roomId(code)) };
  phase = 'lobby';
  net.peer.on('error', failNet);
  net.peer.on('connection', conn => {
    net.conn?.close();
    net.conn = conn;
    conn.on('open', () => {
      net.lost = false;
      sendState();
      if (phase === 'lobby') enterStage();
      render();
    });
    conn.on('data', msg => { if (net?.conn === conn) onGuestMove(msg); });
    conn.on('close', () => { if (net?.conn === conn) { net.lost = true; render(); } });
  });
}

function receiveState(next) {
  next.history.forEach(h => { h.hands = h.seqs.map(q => evaluate(h.turn, q)); });
  const prev = s;
  s = next;
  if (!prev || next.history.length < prev.history.length || (phase === 'waiting' && next.history.length === prev.history.length)) enterStage();
  else if (next.history.length > prev.history.length) phase = 'result';
  render();
}

function joinRoom(code) {
  mode = 'online';
  viewer = 1;
  s = null;
  phase = 'lobby';
  net = { role:'guest', code, conn:null, lost:false, peer:new Peer() };
  net.peer.on('error', failNet);
  net.peer.on('open', () => {
    const conn = net.peer.connect(roomId(code), { serialization:'json', reliable:true });
    net.conn = conn;
    conn.on('open', () => { net.lost = false; render(); });
    conn.on('data', msg => { if (msg?.type === 'state' && isValidView(msg.s)) receiveState(msg.s); });
    conn.on('close', () => { if (net?.conn === conn) { net.lost = true; render(); } });
  });
  setTimeout(() => { if (net?.code === code && !net.conn?.open) failNet({ type:'timeout' }); }, 20000);
}

function submitOnline(type, value) {
  phase = 'waiting';
  if (net.role === 'guest') {
    if (net.conn?.open) net.conn.send(type === 'assign' ? { type, assign:value } : { type, fighter:value });
    return;
  }
  if (type === 'assign') assigns[0] = value; else fighters[0] = value;
  hostAdvance();
}

const actions = {
  start({ mode: m }) { leaveRoom(); mode = m; s = newGame(); beginTurn(); },
  home() { leaveRoom(); phase = 'start'; },
  host() {
    if (typeof Peer === 'undefined') { notice = '온라인 대전에는 인터넷 연결이 필요합니다.'; return; }
    openRoom();
  },
  join() {
    const code = document.getElementById('join-code').value.trim().toUpperCase();
    if (typeof Peer === 'undefined') { notice = '온라인 대전에는 인터넷 연결이 필요합니다.'; return; }
    if (!/^[A-Z0-9]{4}$/.test(code)) { notice = '방 코드 4자리를 입력하세요.'; return; }
    joinRoom(code);
  },
  rejoin() {
    const code = net.code;
    leaveRoom();
    joinRoom(code);
  },
  rematch() {
    s = newGame();
    assigns = [null, null];
    fighters = [null, null];
    sendState();
    enterStage();
  },
  ready() { enterStage(); },
  assign({ i, kind }) {
    const at = Number(i), other = ui.assign.indexOf(kind);
    if (other === at) return;
    if (other >= 0) ui.assign[other] = ui.assign[at];
    ui.assign[at] = kind;
    if (ui.assign.filter(k => k === null).length === 1) ui.assign[ui.assign.indexOf(null)] = ['B','W','G'].find(k => !ui.assign.includes(k));
  },
  confirmAssign() {
    if (mode === 'online') return submitOnline('assign', ui.assign);
    assigns[viewer] = ui.assign;
    if (!assigns[1 - viewer]) { viewer = 1 - viewer; phase = 'pass'; return; }
    s = placeStones(s, assigns);
    viewer = 0;
    if (mode === 'bot') {
      fighters[1] = botFight(s, 1);
      enterStage();
    } else phase = 'pass';
  },
  fight({ i }) { ui.fighter = Number(i); },
  confirmFight() {
    if (mode === 'online') return submitOnline('fight', ui.fighter);
    fighters[viewer] = ui.fighter;
    if (fighters[1 - viewer] === null) { viewer = 1 - viewer; phase = 'pass'; return; }
    s = fightTurn(s, fighters);
    phase = 'result';
  },
  next() { if (s.over) phase = 'end'; else if (mode === 'online') enterStage(); else beginTurn(); },
};

function render() {
  const lost = !net?.lost ? '' : net.role === 'host'
    ? `<p class="notice">상대와 연결이 끊겼습니다. 상대가 코드 ${net.code}로 다시 참가하면 이어집니다.</p>`
    : '<p class="notice">방과 연결이 끊겼습니다. <button data-act="rejoin">다시 연결</button></p>';
  app.innerHTML = (notice ? `<p class="notice">${notice}</p>` : '') + lost + screens[phase]();
}

app.addEventListener('click', e => {
  const button = e.target.closest('[data-act]');
  if (!button || button.disabled) return;
  const before = phase;
  notice = '';
  actions[button.dataset.act](button.dataset);
  render();
  if (phase !== before) window.scrollTo(0, 0);
});

render();
</script>
</body>
</html>
